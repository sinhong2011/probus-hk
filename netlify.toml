[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_ENV = "production"

# The router owns every path; the shell has to be served for all of them.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed assets never change; the service worker must never be held.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
