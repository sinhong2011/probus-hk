server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed filenames, so they can be held forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The service worker decides when the app updates; it must never be cached.
  location = /sw.js {
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  # The router owns every path, so unknown ones are the shell rather than a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
